plugins {
    id 'com.android.application'
}

android {
    namespace 'org.haxe.roguelike'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.haxe.roguelike"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DHASHLINK_SRC=${hashlinkSrc}"
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
